name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      # Nur die Dateien ausliefern, die die App wirklich braucht.
      # Vorher ging das komplette Repo-Root hoch — inklusive der SQL-Dateien,
      # der Tests und package-lock.json.
      - name: Seite zusammenstellen
        run: |
          mkdir -p _site/src _site/icons _site/vendor
          cp index.html app.js style.css sw.js manifest.json _site/
          cp icons/*.png _site/icons/
          cp vendor/chart.umd.js _site/vendor/
          # Tests gehören nicht in die Auslieferung
          for f in src/*.js; do
            case "$f" in *.test.js) continue ;; esac
            cp "$f" _site/src/
          done

      # config.js ist gitignored und existiert im Checkout nicht. Ohne diesen
      # Schritt liefe die deployte Seite zwangsläufig in den
      # "Einrichtung nicht abgeschlossen"-Zweig.
      #
      # Hinweis: APP_SECRET wird zwingend an den Browser ausgeliefert und ist
      # auf einer öffentlichen Seite für jeden lesbar. Es ist eine
      # Vandalismus-Bremse, kein Geheimnis.
      - name: config.js aus Repository-Secrets erzeugen
        env:
          # Unter Settings → Secrets and variables → Actions gibt es zwei
          # Reiter. Werte im Reiter "Variables" landen in vars.*, nicht in
          # secrets.* — eine leicht zu übersehende Verwechslung, die dazu
          # führt, dass hier alles leer ankommt. Beide Quellen werden
          # akzeptiert, secrets hat Vorrang.
          SUPABASE_URL:      ${{ secrets.SUPABASE_URL      || vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || vars.SUPABASE_ANON_KEY }}
          APP_SECRET:        ${{ secrets.APP_SECRET        || vars.APP_SECRET }}
          BRANDING_JSON:     ${{ secrets.BRANDING_JSON     || vars.BRANDING_JSON }}
        run: |
          # Nur "gesetzt"/"fehlt" ausgeben — nie die Werte selbst.
          state() { [ -n "$1" ] && echo "gesetzt" || echo "FEHLT"; }
          echo "Gefundene Konfiguration:"
          echo "  SUPABASE_URL      $(state "$SUPABASE_URL")"
          echo "  SUPABASE_ANON_KEY $(state "$SUPABASE_ANON_KEY")"
          echo "  APP_SECRET        $(state "$APP_SECRET")     (optional)"
          echo "  BRANDING_JSON     $(state "$BRANDING_JSON")     (optional)"

          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL und SUPABASE_ANON_KEY fehlen."
            echo "::error::Settings → Secrets and variables → Actions. Dort den Reiter *Secrets* wählen (nicht *Variables*) und die Namen exakt so schreiben."
            echo "::error::Bereits gesetzte Werte im Reiter Variables werden ebenfalls akzeptiert — kommt diese Meldung trotzdem, stimmt der Name nicht."
            exit 1
          fi

          case "$SUPABASE_URL" in
            https://*.supabase.co) ;;
            *) echo "::warning::SUPABASE_URL sieht ungewöhnlich aus — erwartet wird https://PROJEKT.supabase.co" ;;
          esac

          BRANDING="${BRANDING_JSON:-{\}}"

          cat > _site/config.js <<EOF
          var CONFIG = {
              SUPABASE_URL:      $(printf '%s' "$SUPABASE_URL"      | jq -R .),
              SUPABASE_ANON_KEY: $(printf '%s' "$SUPABASE_ANON_KEY" | jq -R .),
              APP_SECRET:        $(printf '%s' "$APP_SECRET"        | jq -R .),
              BRANDING:          ${BRANDING},
          };
          EOF

          node --check _site/config.js && echo "config.js erzeugt"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
